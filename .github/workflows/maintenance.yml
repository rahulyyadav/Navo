name: Navo maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {}
concurrency:
  group: navo-maintenance
  cancel-in-progress: false
jobs:
  process:
    if: vars.NAVO_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Process notifications, deletion retries, and Maya journey reviews
        env:
          NAVO_API_URL: ${{ vars.NAVO_API_URL }}
          NAVO_MAINTENANCE_TOKEN: ${{ secrets.NAVO_MAINTENANCE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          base = os.environ['NAVO_API_URL'].rstrip('/')
          token = os.environ['NAVO_MAINTENANCE_TOKEN']
          if not base.startswith('https://') or len(token) < 32:
              raise SystemExit('Maintenance configuration is incomplete')
          request = urllib.request.Request(base + '/internal/maintenance', data=b'',
              headers={'Authorization': 'Bearer ' + token}, method='POST')
          with urllib.request.urlopen(request, timeout=360) as response:
              if response.status != 200: raise SystemExit('Maintenance failed')
          print('Maintenance pass completed')
          PY
